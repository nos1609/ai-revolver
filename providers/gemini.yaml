# Gemini CLI (Google) — profile provider for ai-revolver.
#
# Data sources:
#   - credential file: ~/.gemini/oauth_creds.json   (0600, plaintext JSON)
#   - companion file:  ~/.gemini/google_accounts.json (0644, tracks `active` account)
#   - OAuth refresh:   https://oauth2.googleapis.com/token  (NOT wired yet —
#                      see NOTES at bottom; grab/switch work without it)
#   - usage REST:      unknown public endpoint — no probe in MVP
#
# Quirks vs codex/claude:
#   • `expiry_date` is already an **absolute epoch MS** (not relative seconds,
#     not seconds). No transform needed on normalise; refresh response from
#     Google returns `expires_in` (relative seconds) — will need
#     `now_ms_plus_seconds` when we wire token_refresh later.
#   • Two files matter: the oauth_creds file AND google_accounts.json (latter
#     tells Gemini CLI which account is the "active" one). Both must be
#     switched together, hence `extra_files`.
#   • `GEMINI_FORCE_FILE_STORAGE=true` forces the CLI to read from file rather
#     than OS keychain — otherwise our file-based switch is ignored on macOS.

name: gemini
version: 1

auth_methods:
  oauth:
    credential_file:
      path: "${HOME}/.gemini/oauth_creds.json"
      format: json
      mapping:
        access_token:  "access_token"
        refresh_token: "refresh_token"
        expires_at:    "expiry_date"
      grab_fields:
        - "token_type"
        - "scope"
        - "id_token"
      permissions: 0o600
      atomic_write: true
      preserve_unknown_fields: true

    # Companion file — tracks which Google account is "active".
    # Switched together with oauth_creds.json.
    extra_files:
      - path: "${HOME}/.gemini/google_accounts.json"
        format: json
        grab_fields:
          - "active"
        permissions: 0o644

    # Ensures the CLI reads credentials from file instead of OS keychain.
    # Without this, our file-based switch on macOS is silently ignored.
    env_on_switch:
      GEMINI_FORCE_FILE_STORAGE: "true"

    # token_refresh: NOT WIRED.
    # Rationale: no usage probe in MVP → no refresh trigger needed.
    # When we add a probe, uncomment and verify:
    #   url: "https://oauth2.googleapis.com/token"
    #   body:
    #     client_id:     "<from Gemini CLI source>"
    #     client_secret: "<from Gemini CLI source>"  # Google requires both for installed apps
    #     grant_type:    "refresh_token"
    #     refresh_token: "${credentials.refresh_token}"
    #   update:
    #     access_token: "access_token"
    #     expires_at:   "expires_in | now_ms_plus_seconds"

  api_key:
    env:
      GEMINI_API_KEY: "${api_key}"

detection:
  commands: ["gemini"]
  paths: ["${HOME}/.gemini/"]

# No `usage:` section — Gemini Code Assist rate limits are not exposed via a
# public REST endpoint we can probe without extra auth (quota lives in GCP).

identity:
  # Google's oauth_creds.json does not expose a stable user sub outside the
  # id_token JWT. 'scope' is the best available stable per-user signal in V1;
  # full sub-claim extraction requires JWT decode (V2).
  fields:
    - "scope"
  display:
    - "${credentials.scope}"
