# Grok CLI (xAI) — profile provider for ai-revolver.
#
# Data sources:
#   - credential file: ~/.grok/auth.json  (plaintext JSON, dynamic top-level bucket key with prefix)
#   - OAuth refresh:   https://auth.x.ai/oauth2/token  (JSON body)
#   - usage REST:      unknown public endpoint — no probe
#
# dynamic_bucket_prefix: reader/writer auto-detect the single top-level key
#   matching the prefix (e.g. https://auth.x.ai::...UUID). grab_data gets
#   _auth_bucket_key injected. On switch writer writes under that bucket and
#   prunes other keys with same prefix.
#
# Mapping/grab_fields/identity use relative paths (resolved under detected bucket).
# No transforms in mapping paths (e.g. no iso_to_ms).
#
# Reference: codex.yaml etc. Existing providers without dynamic_bucket_prefix unaffected.

name: grok
version: 1

auth_methods:
  oauth:
    credential_file:
      path: "${HOME}/.grok/auth.json"
      format: json
      dynamic_bucket_prefix: "https://auth.x.ai::"
      mapping:
        access_token: "key"
        refresh_token: "refresh_token"
      grab_fields:
        - "user_id"
        - "email"
        - "team_id"
        - "principal_id"
        - "auth_mode"
        - "create_time"
      permissions: 0o600
      atomic_write: true
      preserve_unknown_fields: true

    token_refresh:
      url: "https://auth.x.ai/oauth2/token"
      body:
        grant_type:    "refresh_token"
        refresh_token: "${credentials.refresh_token}"
        client_id:     "b1a00492-073a-47ea-816f-4c329264a828"
      update:
        access_token:  "access_token"
        refresh_token: "refresh_token"

  api_key:
    env:
      XAI_API_KEY: "${api_key}"

detection:
  commands: ["grok"]
  paths: ["${HOME}/.grok/"]

identity:
  fields:
    - "user_id"
  display:
    - "${email}"
