# Grok CLI (xAI) — profile provider for ai-revolver (MVP).
#
# Data sources:
#   - credential file: ~/.grok/auth.json  (plaintext JSON, dynamic top-level bucket key)
#   - OAuth refresh:   https://auth.x.ai/oauth2/token  (JSON body)
#   - usage REST:      unknown public endpoint — no probe in MVP
#
# MVP limitations:
#   - Hardcoded OAuth bucket key: `https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828`
#     (top-level key in auth.json is dynamic per login; bracket path required)
#   - No `usage:` section (no live rate-limit probe for `airev grok usage`)
#   - `access_token` stored under `.key` inside the bucket (mapped to normalized field)
#   - writer uses mapping inverse to put tokens back under `.key`
#
# Reference impl: codex.yaml / gemini.yaml
# Bracket path support: tests/unit/provider-reader.test.ts (e.g. ['github.com'])

name: grok
version: 1

auth_methods:
  oauth:
    credential_file:
      path: "${HOME}/.grok/auth.json"
      format: json
      mapping:
        access_token:  "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].key"
        refresh_token: "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].refresh_token"
        expires_at:    "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].expires_at | iso_to_ms"
      grab_fields:
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].user_id"
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].email"
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].team_id"
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].principal_id"
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].auth_mode"
        - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].create_time"
      permissions: 0o600
      atomic_write: true
      preserve_unknown_fields: true

    token_refresh:
      url: "https://auth.x.ai/oauth2/token"
      body:
        grant_type:    "refresh_token"
        refresh_token: "${credentials.refresh_token}"
        client_id:     "b1a00492-073a-47ea-816f-4c329264a828"
      update:
        access_token:  "access_token"
        refresh_token: "refresh_token"

  api_key:
    env:
      XAI_API_KEY: "${api_key}"

detection:
  commands: ["grok"]
  paths: ["${HOME}/.grok/"]

identity:
  fields:
    - "['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].user_id"
  display:
    - "${['https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828'].email}"
