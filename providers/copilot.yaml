# GitHub Copilot CLI — profile provider for ai-revolver.
#
# Data sources:
#   - config file:     ~/.copilot/config.json
#   - token keychain:  keytar service `copilot-cli`,
#                      account `https://github.com:<login>`
#   - usage REST:      GET https://api.github.com/copilot_internal/user
#
# Notes:
#   • This provider intentionally uses the standalone Copilot CLI config and
#     keytar store. It does not inspect VS Code SecretStorage or running VS Code
#     sessions, so `airev usage` stays a plain CLI operation.
#   • The endpoint is read-only and returns personal quota snapshots when the
#     OAuth token has access.

name: copilot
version: 1

auth_methods:
  oauth:
    credential_file:
      path: "${HOME}/.copilot/config.json"
      format: jsonc
      mapping: {}
      grab_fields:
        - "lastLoggedInUser.host"
        - "lastLoggedInUser.login"
      permissions: 0o600
      atomic_write: true
      preserve_unknown_fields: true
    credential_secrets:
      - backend: keytar
        service: "copilot-cli"
        account: "${grab_data.lastLoggedInUser.host}:${grab_data.lastLoggedInUser.login}"
        mapping:
          access_token: password

detection:
  commands: ["gh"]
  paths: ["${HOME}/.copilot/"]

usage:
  probes:
    - url: "https://api.github.com/copilot_internal/user"
      parser: "copilot_internal_user"
      headers:
        Authorization: "Bearer ${credentials.access_token}"
        Accept: "application/json"
        User-Agent: "ai-revolver"
      map: {}
