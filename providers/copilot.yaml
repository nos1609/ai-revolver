# GitHub Copilot CLI — profile provider for ai-revolver.
#
# Data sources:
#   - config file:     ~/.copilot/config.json
#   - token store:     current Copilot CLI runtime; it applies the CLI's own
#                      system keychain/plaintext fallback policy
#   - usage REST:      GET https://api.github.com/copilot_internal/user
#
# Notes:
#   • This provider intentionally uses the standalone Copilot CLI config and
#     bundled token-store runtime. It does not inspect VS Code SecretStorage or
#     running VS Code sessions, so `airev usage` stays a plain CLI operation.
#   • The endpoint is read-only and returns personal quota snapshots when the
#     OAuth token has access.

name: copilot
version: 1

auth_methods:
  oauth:
    credential_file:
      path: "${HOME}/.copilot/config.json"
      format: jsonc
      mapping: {}
      grab_fields:
        - "lastLoggedInUser.host"
        - "lastLoggedInUser.login"
        - "storeTokenPlaintext"
      permissions: 0o600
      atomic_write: true
      preserve_unknown_fields: true
    credential_secrets:
      - backend: copilot-token-store
        host: "${grab_data.lastLoggedInUser.host}"
        login: "${grab_data.lastLoggedInUser.login}"
        mapping:
          access_token: token

  api_key:
    env:
      COPILOT_GITHUB_TOKEN: "${api_key}"

detection:
  commands: ["copilot"]
  paths: ["${HOME}/.copilot/"]

usage:
  probes:
    - url: "https://api.github.com/copilot_internal/user"
      parser: "copilot_internal_user"
      headers:
        Authorization: "Bearer ${credentials.access_token}"
        Accept: "application/json"
        User-Agent: "ai-revolver"
      map: {}

identity:
  fields:
    - "lastLoggedInUser.login"
  display:
    - "${lastLoggedInUser.login}"
