---
name: ci

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

env:
  NPM_CLI: npm@12.0.1
  NPM_CONFIG_ENGINE_STRICT: 'true'

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Preflight toolchain
        run: |
          node --version
          npx --yes "$NPM_CLI" --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
          node -e 'if (require("./package.json").packageManager !== process.env.NPM_CLI) process.exit(1)'

      - name: Install locked dependencies
        run: npx --yes "$NPM_CLI" ci

      - name: Review install-script policy
        run: npx --yes "$NPM_CLI" install-scripts ls

      - name: Verify source and documentation
        run: npx --yes "$NPM_CLI" run check

      - name: Build package
        run: npx --yes "$NPM_CLI" run build

      - name: Audit runtime dependencies
        run: npx --yes "$NPM_CLI" audit --omit=dev

      - name: Verify package contents
        run: npx --yes "$NPM_CLI" pack --dry-run --json
